# Run manually: kubectl apply -f k8s/k6-job.yaml
# Rerun: kubectl delete job k6 --ignore-not-found && kubectl apply -f k8s/k6-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: k6
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: k6
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          args: ['run', '/scripts/baseline.js']
          env:
            - name: BASE_URL
              value: http://backend:4000
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: k6-script
