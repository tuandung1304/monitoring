apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - postgres.yaml
  - postgres-exporter.yaml
  - backend.yaml
  - prometheus.yaml
  - node-exporter.yaml
  - grafana.yaml
  # k6-job.yaml is intentionally excluded
  # Run it with: kubectl apply -f k8s/k6-job.yaml

# ConfigMaps that embed files from outside k8s/ (db/, prometheus/, grafana/, k6/)
# can't use configMapGenerator here: kustomize refuses to read files outside its
# own root (LoadRestrictionsRootOnly, not overridable via `kubectl apply -k`).
# They're generated by k8s/scripts/deploy.sh instead, straight from those
# source-of-truth files, so nothing is duplicated.

secretGenerator:
  # Local dev/load-test credentials only — matches the defaults already
  # committed in ../.env.example. Not for production use.
  - name: postgres-credentials
    literals:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app_password
      - POSTGRES_DB=loadtest
      - DATABASE_URL=postgresql://app:app_password@postgres:5432/loadtest
      - DATA_SOURCE_NAME=postgresql://app:app_password@postgres:5432/loadtest?sslmode=disable

  - name: grafana-credentials
    literals:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

generatorOptions:
  disableNameSuffixHash: false
