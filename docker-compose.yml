services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app_password}
      - POSTGRES_DB=${POSTGRES_DB:-loadtest}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
      - ./db/migrations/002_indexes.sql:/docker-entrypoint-initdb.d/002_indexes.sql:ro
      - ./db/seed/001_seed_users_products.sql:/docker-entrypoint-initdb.d/003_seed_users_products.sql:ro
      - ./db/seed/002_seed_orders.sql:/docker-entrypoint-initdb.d/004_seed_orders.sql:ro
    ports:
      - '5432:5432'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-loadtest}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-loadtest}?sslmode=disable
    ports:
      - '9187:9187'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monitoring

  backend:
    build: ./backend
    container_name: backend
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-loadtest}
      # Fraction (0-1) of API requests to fail with a random 5xx, e.g. 0.03 for ~3%.
      # Leave at 0 for normal runs; set via `CHAOS_5XX_RATE=0.03 docker compose ...`.
      - CHAOS_5XX_RATE=${CHAOS_5XX_RATE:-0}
    ports:
      - '4000:4000'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monitoring

  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles:
      - load-test
    volumes:
      - ./k6:/scripts:ro
    environment:
      - BASE_URL=http://backend:4000
    command: run /scripts/baseline.js
    depends_on:
      - backend
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '9090:9090'
    restart: unless-stopped
    depends_on:
      - backend
      - postgres-exporter
      - node-exporter
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - '9100:9100'
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  pgdata:

networks:
  monitoring:
